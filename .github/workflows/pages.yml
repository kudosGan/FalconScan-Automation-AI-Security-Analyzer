# Publishes the public website (landing page only) to GitHub Pages.
# The application code is never published: the site is built from frontend/site.html, which includes none of it. Run it by hand from the Actions tab too. It is the only workflow that publishes anything.
name: Publish public website

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the public website
        working-directory: frontend
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # Address of the live application, set under Settings > Secrets and variables > Actions > Variables (name: APP_URL).
          VITE_APP_URL: ${{ vars.APP_URL }}
        run: |
          npm ci
          npm run build:site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
